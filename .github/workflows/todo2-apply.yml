name: TODO-2 Apply And Validate

on:
  push:
    branches:
      - todo-2-dialog-dismiss-rider-dirty
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply scoped TODO-2 patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 56a9d94b8cb5ae598e8a7b554c429787b86ecdc7 HEAD
          python3 .github/todo2_apply.py
          rm -f .github/todo2_apply.py .github/workflows/todo2-apply.yml .github/workflows/todo2-dialog-audit.yml
          echo 'Changed files vs baseline:'
          git diff --name-only 56a9d94b8cb5ae598e8a7b554c429787b86ecdc7 --
          python3 - <<'PY'
          import subprocess
          allowed = {
              'REGRESSION_MATRIX.md',
              'app/src/main/java/ar/com/mandados/app/MandadosApp.kt',
              'app/src/main/java/ar/com/mandados/app/OperationsScreens.kt',
              'app/src/main/java/ar/com/mandados/app/Punto25DialogPolicy.kt',
              'app/src/test/java/ar/com/mandados/app/DialogDismissPolicyTest.kt',
          }
          changed = set(subprocess.check_output([
              'git','diff','--name-only','56a9d94b8cb5ae598e8a7b554c429787b86ecdc7','--'
          ], text=True).splitlines())
          extra = changed - allowed
          missing = {'app/src/main/java/ar/com/mandados/app/Punto25DialogPolicy.kt','app/src/test/java/ar/com/mandados/app/DialogDismissPolicyTest.kt'} - changed
          if extra or missing:
              raise SystemExit(f'diff scope invalid extra={sorted(extra)} missing={sorted(missing)}')
          PY
          grep -F 'applicationId = "ar.com.mandados.app"' app/build.gradle.kts
          grep -F 'versionCode = 16' app/build.gradle.kts
          grep -F 'versionName = "0.3-alpha3-dev3.9"' app/build.gradle.kts
      - name: Unit tests and debug assembly
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Implement safe dialog dismissal and Rider dirty-state protection'
          git push origin HEAD:todo-2-dialog-dismiss-rider-dirty
