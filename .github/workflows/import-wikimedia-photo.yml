name: Import licensed Wikimedia photo

on:
  push:
    branches:
      - chore/replace-church-photo-licensed

permissions:
  contents: write

jobs:
  import-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/replace-church-photo-licensed

      - name: Download licensed Wikimedia image
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/res/drawable-nodpi/punto25_login_church.jpg'
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/Iglesia_Nuestra_Se%C3%B1ora_del_Rosario-_Buenos_Aires.JPG?width=1024'
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 "$url" --output "$target"
          test "$(stat -c%s "$target")" -gt 100000
          file "$target" | grep -q 'JPEG image data'

      - name: Commit image and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-wikimedia-photo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/punto25_login_church.jpg .github/workflows/import-wikimedia-photo.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Replace church photo with licensed Wikimedia asset'
          git push origin HEAD:chore/replace-church-photo-licensed
