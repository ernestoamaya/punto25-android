name: Tanda 2B Auth Fix

on:
  push:
    branches: [ "tanda2b-work" ]
    paths: [ "RUN_TANDA2B_AUTH_FIX" ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Apply authenticated Rider fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .tanda2b/security-fix.py
          git add \
            REGRESSION_MATRIX.md \
            app/src/main/java/ar/com/mandados/app/MandadosApp.kt \
            app/src/main/java/ar/com/mandados/app/MandadosController.kt \
            app/src/main/java/ar/com/mandados/app/TipTransferPolicy.kt \
            app/src/test/java/ar/com/mandados/app/TipTransferPolicyTest.kt
          git diff --cached --check
          printf '%s\n' \
            REGRESSION_MATRIX.md \
            app/src/main/java/ar/com/mandados/app/MandadosApp.kt \
            app/src/main/java/ar/com/mandados/app/MandadosController.kt \
            app/src/main/java/ar/com/mandados/app/TipTransferPolicy.kt \
            app/src/test/java/ar/com/mandados/app/TipTransferPolicyTest.kt \
            | sort > /tmp/allowed.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Required focused regression
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          PUNTO25_API_BASE_URL: ${{ secrets.PUNTO25_API_BASE_URL }}
          WHATSAPP_VERIFY_NUMBER: ${{ secrets.WHATSAPP_VERIFY_NUMBER }}
        run: >-
          gradle :app:testDebugUnitTest
          --tests "ar.com.mandados.app.TipTransferPolicyTest"
          --tests "ar.com.mandados.app.PaymentTransferPolicyTest"
          --tests "ar.com.mandados.app.CustomerOrderOwnershipTest"
          --stacktrace --no-daemon

      - name: Full unit regression lint and debug build
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          PUNTO25_API_BASE_URL: ${{ secrets.PUNTO25_API_BASE_URL }}
          WHATSAPP_VERIFY_NUMBER: ${{ secrets.WHATSAPP_VERIFY_NUMBER }}
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Commit verified auth fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Punto25 Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Bind Tanda 2B tips to authenticated Rider session"
          git push origin HEAD:tanda2b-work
