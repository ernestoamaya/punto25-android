name: Alpha APK

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character commit SHA from trusted main history"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-apk-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  signed-alpha-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate target SHA and trusted main ancestry
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          validate_target() {
            local candidate="$1"
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || return 10
            [[ "$(git cat-file -t "$candidate" 2>/dev/null || true)" == "commit" ]] || return 11
            git merge-base --is-ancestor "$candidate" refs/remotes/origin/main || return 12
          }

          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

          WORKFLOW_SOURCE_SHA="$GITHUB_SHA"
          TRUSTED_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          echo "Workflow source SHA: $WORKFLOW_SOURCE_SHA"
          echo "Requested target SHA: $REQUESTED_TARGET_SHA"
          echo "Trusted main SHA: $TRUSTED_MAIN_SHA"

          # REG-PACKAGING-SHA-001: a real commit from trusted main history is accepted.
          validate_target "$TRUSTED_MAIN_SHA" || {
            echo "REG-PACKAGING-SHA-001 failed: trusted main HEAD was rejected." >&2
            exit 1
          }

          # REG-PACKAGING-SHA-002: a syntactically valid but nonexistent SHA is rejected.
          NONEXISTENT_SHA="0000000000000000000000000000000000000000"
          if validate_target "$NONEXISTENT_SHA"; then
            echo "REG-PACKAGING-SHA-002 failed: nonexistent SHA was accepted." >&2
            exit 1
          fi

          # REG-PACKAGING-SHA-003: an existing commit object outside main ancestry is rejected.
          SYNTHETIC_TREE="$(git rev-parse refs/remotes/origin/main^{tree})"
          SYNTHETIC_NON_MAIN_SHA="$(
            printf '%s\n' 'REG-PACKAGING-SHA-003 synthetic non-main commit' |
              GIT_AUTHOR_NAME='Punto25 Packaging Regression' \
              GIT_AUTHOR_EMAIL='packaging-regression@localhost' \
              GIT_COMMITTER_NAME='Punto25 Packaging Regression' \
              GIT_COMMITTER_EMAIL='packaging-regression@localhost' \
              git commit-tree "$SYNTHETIC_TREE"
          )"
          if validate_target "$SYNTHETIC_NON_MAIN_SHA"; then
            echo "REG-PACKAGING-SHA-003 failed: non-main commit was accepted." >&2
            exit 1
          fi

          if ! validate_target "$REQUESTED_TARGET_SHA"; then
            echo "Requested target_sha is not a full lowercase commit SHA in trusted main history." >&2
            exit 1
          fi

          echo "REG-PACKAGING-SHA-001: PASS"
          echo "REG-PACKAGING-SHA-002: PASS"
          echo "REG-PACKAGING-SHA-003: PASS"
          echo "WORKFLOW_SOURCE_SHA=$WORKFLOW_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "TRUSTED_MAIN_SHA=$TRUSTED_MAIN_SHA" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$REQUESTED_TARGET_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_SHA"
          git clean -ffdx
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "Checked-out target SHA: $CHECKED_OUT_SHA"
          if [[ "$CHECKED_OUT_SHA" != "$TARGET_SHA" ]]; then
            echo "REG-PACKAGING-CHECKOUT-001 failed: checked-out SHA does not match target_sha." >&2
            exit 1
          fi
          echo "REG-PACKAGING-CHECKOUT-001: PASS"
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Validate private Alpha signing configuration
        shell: bash
        env:
          ALPHA_KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
          ALPHA_ADMIN_PIN: ${{ secrets.ALPHA_ADMIN_PIN }}
        run: |
          set -euo pipefail
          if [[ -z "$ALPHA_KEYSTORE_B64" || -z "$ALPHA_KEYSTORE_PASSWORD" || -z "$ALPHA_KEY_ALIAS" || -z "$ALPHA_KEY_PASSWORD" ]]; then
            echo "Stable Alpha signing secrets are not configured." >&2
            exit 1
          fi
          if ! [[ "$ALPHA_ADMIN_PIN" =~ ^[0-9]{6,8}$ ]]; then
            echo "ALPHA_ADMIN_PIN must be a private 6-8 digit PIN." >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/punto25-alpha.jks"
          printf '%s' "$ALPHA_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ALPHA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "REG-PACKAGING-SECRETS-001: signing inputs validated without exposing values."

      - name: Resolve target app metadata
        id: app_metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          APPLICATION_ID="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" || -z "$APPLICATION_ID" ]]; then
            echo "Unable to resolve target app metadata." >&2
            exit 1
          fi
          SHORT_TARGET_SHA="${TARGET_SHA:0:12}"
          ARTIFACT_NAME="Punto25-v${VERSION_NAME}-${SHORT_TARGET_SHA}-debug"
          APK_NAME="${ARTIFACT_NAME}.apk"
          echo "Target versionName: $VERSION_NAME"
          echo "Target versionCode: $VERSION_CODE"
          echo "Target applicationId: $APPLICATION_ID"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Unit tests and signed debug build
        env:
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
          ALPHA_ADMIN_PIN: ${{ secrets.ALPHA_ADMIN_PIN }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          PUNTO25_API_BASE_URL: ${{ secrets.PUNTO25_API_BASE_URL }}
          WHATSAPP_VERIFY_NUMBER: ${{ secrets.WHATSAPP_VERIFY_NUMBER }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify signature, hash and provenance
        shell: bash
        env:
          VERSION_NAME: ${{ steps.app_metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_metadata.outputs.version_code }}
          APPLICATION_ID: ${{ steps.app_metadata.outputs.application_id }}
          APK_NAME: ${{ steps.app_metadata.outputs.apk_name }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/36.0.0/apksigner"
          if [[ ! -f "$SOURCE_APK" ]]; then
            echo "Expected debug APK was not produced." >&2
            exit 1
          fi
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner not found at expected path: $APKSIGNER" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$SOURCE_APK"
          echo "REG-PACKAGING-SIGN-001: PASS"

          cp "$SOURCE_APK" "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          APK_SHA256="$(awk '{print $1}' SHA256SUMS.txt)"
          echo "REG-PACKAGING-HASH-001: PASS"
          cat SHA256SUMS.txt

          BUILD_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > BUILD_PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          workflow_source_sha=$WORKFLOW_SOURCE_SHA
          trusted_main_sha=$TRUSTED_MAIN_SHA
          requested_target_sha=$TARGET_SHA
          checked_out_target_sha=$CHECKED_OUT_SHA
          workflow_run_id=$GITHUB_RUN_ID
          workflow_run_attempt=$GITHUB_RUN_ATTEMPT
          versionName=$VERSION_NAME
          versionCode=$VERSION_CODE
          applicationId=$APPLICATION_ID
          build_timestamp_utc=$BUILD_TIMESTAMP_UTC
          apk_filename=$APK_NAME
          apk_sha256=$APK_SHA256
          EOF

          if [[ "$(grep '^checked_out_target_sha=' BUILD_PROVENANCE.txt | cut -d= -f2-)" != "$TARGET_SHA" ]]; then
            echo "REG-PACKAGING-PROVENANCE-001 failed: provenance target mismatch." >&2
            exit 1
          fi
          echo "REG-PACKAGING-PROVENANCE-001: PASS"

      - name: Upload Alpha APK evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.app_metadata.outputs.artifact_name }}
          path: |
            ${{ steps.app_metadata.outputs.apk_name }}
            SHA256SUMS.txt
            BUILD_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
